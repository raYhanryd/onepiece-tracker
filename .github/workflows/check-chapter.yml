name: Check for new One Piece chapter

on:
  schedule:
    # Times are UTC. Spread across the day, ~5 checks/day.
    # 06:00, 10:30, 15:00, 19:30, 23:45 UTC
    #  -> 11:30, 16:00, 20:30, IST next-day 01:00, 05:15 IST
    - cron: "0 6 * * *"
    - cron: "30 10 * * *"
    - cron: "0 15 * * *"
    - cron: "30 19 * * *"
    - cron: "45 23 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run"
        type: choice
        options:
          - check
          - dry-run
          - check-webhooks
        default: check

permissions:
  contents: write  # required so the job can commit/push the updated state file

# Serialize runs so two checks can never race each other on the state commit.
concurrency:
  group: check-chapter
  cancel-in-progress: false

jobs:
  check-chapter:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Run chapter check
        id: check
        # Keep going even if the check fails, so the state file can still be
        # committed below. A failed delivery must update the state (which
        # webhooks already got the chapter) or the next run would re-notify
        # every channel -- that was the duplicate-message bug.
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL_2: ${{ secrets.DISCORD_WEBHOOK_URL_2 }}
        run: |
          case "${{ github.event.inputs.mode || 'check' }}" in
            dry-run) python3 scripts/check_chapter.py --dry-run ;;
            check-webhooks) python3 scripts/check_chapter.py --check-webhooks ;;
            *) python3 scripts/check_chapter.py ;;
          esac

      - name: Commit and push updated state (if changed)
        if: always()
        run: |
          if ! git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            echo "No git checkout; nothing to commit."
            exit 0
          fi
          if git diff --quiet -- state/last_chapter.json; then
            echo "No state change, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/last_chapter.json
          git commit -m "chore: update last seen chapter [skip ci]"
          # Another push may have landed since checkout; replay on top of it.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Fail the run if the check reported a problem
        if: steps.check.outcome == 'failure'
        run: |
          echo "::error::Chapter check reported a problem -- see the [ERROR] block above."
          exit 1
