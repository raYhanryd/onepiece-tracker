name: Check for new One Piece chapter

on:
  schedule:
    # Times are UTC. Spread across the day, ~5 checks/day.
    # 06:00, 10:30, 15:00, 19:30, 23:45 UTC
    #  -> 11:30, 16:00, 20:30, IST next-day 01:00, 05:15 IST
    - cron: "0 6 * * *"
    - cron: "30 10 * * *"
    - cron: "0 15 * * *"
    - cron: "30 19 * * *"
    - cron: "45 23 * * *"
  workflow_dispatch: {}  # allows manual "Run workflow" from the Actions tab

permissions:
  contents: write  # required so the job can commit/push the updated state file

jobs:
  check-chapter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run chapter check
        id: check
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python3 scripts/check_chapter.py

      - name: Commit and push updated state (if changed)
        run: |
          if git diff --quiet -- state/last_chapter.json; then
            echo "No state change, nothing to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state/last_chapter.json
            git commit -m "chore: update last seen chapter [skip ci]"
            git push
          fi
